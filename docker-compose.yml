version: '3.8'

services:
  item-db:
    image: mongo:3
    container_name: item-db
    volumes:
      - app-db:/data/db
    restart: always

  item-app:
    image: fazerdaze/item-app:v1
    container_name: item-app
    working_dir: /app
    ports:
      - "80:8080"
    depends_on:
      - item-db
    restart: always

volumes:
  app-db: